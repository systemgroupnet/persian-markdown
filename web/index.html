<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ویرایشگر مارک‌داون فارسی</title>

    <!-- Self-hosted Vazirmatn — no CDN, ever. Preloading the variable file
         covers every weight the UI uses in one request. -->
    <link
      rel="preload"
      href="/assets/fonts/Vazirmatn[wght].woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <!-- Pre-paint theme restore.
         Deliberately inline and render-blocking: React only applies the
         stored preference in an effect, so without this a user who forced
         light on a dark-mode machine gets a full-page flash of dark before
         the first paint. Four lines in the <head> is the standard price for
         not having that.
         The key and attribute MUST match src/app/useTheme.ts. -->
    <script>
      try {
        var t = localStorage.getItem("pmd:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        /* storage blocked — fall through to prefers-color-scheme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
